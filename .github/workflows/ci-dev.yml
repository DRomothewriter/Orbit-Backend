name: CI Dev Security & Build

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate Source Branch & TypeScript Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate source branch policy and naming convention
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "main" ]; then
            echo "::error::No se permite abrir Pull Requests directamente desde 'main' hacia 'dev'."
            exit 1
          fi

          if ! [[ "$HEAD_REF" =~ ^(feature/|bug/|fix/|docs/|chore/|refactor/|test/|dependabot/) ]]; then
            echo "::warning::La rama '$HEAD_REF' no sigue un prefijo recomendado (feature/, bug/, fix/, docs/, chore/, refactor/, test/)."
          else
            echo "Rama origen válida: $HEAD_REF"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  secret-scanning:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog verified secret scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Record TruffleHog scan metadata
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCAN_OUTCOME: ${{ steps.trufflehog.outcome }}
        run: |
          cat <<EOF > trufflehog-results.json
          {
            "tool": "trufflehog",
            "base": "${BASE_SHA}",
            "head": "${HEAD_SHA}",
            "extra_args": "--only-verified",
            "outcome": "${SCAN_OUTCOME}"
          }
          EOF

      - name: Upload TruffleHog scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-secrets-reports
          path: trufflehog-results.json
          retention-days: 14
          if-no-files-found: warn

  sca-audit:
    name: SCA (npm audit, Dependency Review & Snyk)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review (PR diff HIGH/CRITICAL gate)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit for production dependencies (HIGH/CRITICAL gate)
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit-report.json
          AUDIT_EXIT=$?
          set -e
          if [ "$AUDIT_EXIT" -ne 0 ]; then
            echo "::error::npm audit detectó vulnerabilidades HIGH o CRITICAL en dependencias de producción."
            exit "$AUDIT_EXIT"
          fi

      - name: Determine Snyk SCA gate for Dependabot PRs
        id: snyk-gate
        env:
          ACTOR: ${{ github.actor }}
          HAS_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::SNYK_TOKEN no está disponible para dependabot[bot]; se omite Snyk SCA y se mantienen Dependency Review y npm audit."
            echo "run_snyk=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_snyk=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Snyk Open Source SCA
        id: snyk-sca
        if: steps.snyk-gate.outputs.run_snyk == 'true'
        continue-on-error: true
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=low --sarif-file-output=snyk-sca.sarif --json-file-output=snyk-sca.json

      - name: Evaluate Snyk SCA severities (warn low/medium, fail high/critical)
        if: steps.snyk-gate.outputs.run_snyk == 'true'
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("snyk-sca.json")) {
              console.error("::error::Snyk no generó snyk-sca.json (posible error de token o red).");
              process.exit(1);
            }
            const data = JSON.parse(fs.readFileSync("snyk-sca.json", "utf8"));
            const vulns = Array.isArray(data)
              ? data.flatMap(r => r.vulnerabilities || [])
              : (data.vulnerabilities || []);
            const counts = { low: 0, medium: 0, high: 0, critical: 0 };
            for (const v of vulns) {
              if (counts[v.severity] !== undefined) counts[v.severity]++;
            }
            if (counts.low > 0 || counts.medium > 0) {
              console.log(`::warning::Snyk SCA detectó ${counts.medium} vulnerabilidades MEDIUM y ${counts.low} LOW.`);
            }
            if (counts.high > 0 || counts.critical > 0) {
              console.error(`::error::Snyk SCA detectó ${counts.critical} CRITICAL y ${counts.high} HIGH. Merge bloqueado.`);
              process.exit(1);
            }
          '

      - name: Upload Snyk SCA SARIF to GitHub Security
        if: always() && steps.snyk-gate.outputs.run_snyk == 'true' && hashFiles('snyk-sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca

      - name: Upload SCA reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sca-secrets-reports
          path: |
            npm-audit-report.json
            snyk-sca.sarif
          retention-days: 14
          if-no-files-found: warn
